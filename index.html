<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilonek</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #00fff2;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-y: auto; 
      overflow-x: hidden; 
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000000; 
    }

    ::-webkit-scrollbar-thumb {
      background: #00fff2; 
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00cccc; 
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #00fff2 #000000;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://wallpaperaccess.com/full/138618.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(252, 252, 252, 0.055); 
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 10;
      padding: 2rem;
      padding-bottom: 4rem; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; 
      min-height: 100vh;
    }

    .glass {
      background: #f1f1f121;
      backdrop-filter: blur(20px);
      border: 1px solid #000000fd;
    }
  </style>
</head>
<body>

  <!-- bck -->
  <div class="background"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="max-w-md w-full text-center space-y-10">

             alt="VOIDFORGE"

       Web & Software Developer, mam 3 letnie doświadczenie w kodowaniu. Zajmuje sie rowniez testami penetracyjnymi.

<a href="https://discord.com/users/1236587790314110991" target="_blank" class="glass block px-7 py-5 rounded-2xl flex items-center justify-between hover:bg-white/10 transition-all">

   class="glass block px-7 py-5 rounded-2xl flex items-center justify-between hover:bg-white/10 transition-all">

    </div>
  </div>
</body>
</html>
